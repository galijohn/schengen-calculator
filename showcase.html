<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Mockup — Sizes & Themes</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif}
  body{background:#e7ebf0;color:#1c2431;padding:26px 14px 60px}
  h1{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px}
  .lead{text-align:center;color:#5a6572;font-size:14px;margin-bottom:34px}
  .sec{margin:0 auto 46px;max-width:1000px}
  .sec h3{font-size:15px;color:#3a4653;margin:0 0 14px;text-align:center}
  .pair{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
  .col{flex-direction:column;align-items:center}
  .cap{font-size:12px;color:#8a95a2;text-align:center;margin-top:8px}

  .browser{border-radius:14px;overflow:hidden;box-shadow:0 14px 44px rgba(20,30,45,.2);background:#0e1319;width:960px;max-width:100%}
  .browser .bar{height:34px;background:#242a33;display:flex;align-items:center;gap:7px;padding:0 13px}
  .browser.lite .bar{background:#dfe3e8}
  .browser .bar span{width:10px;height:10px;border-radius:50%}
  .browser .bar span:nth-child(1){background:#ff5f57}.browser .bar span:nth-child(2){background:#febc2e}.browser .bar span:nth-child(3){background:#28c840}
  .browser iframe{display:block;width:100%;height:600px;border:0}

  .tablet{width:760px;max-width:100%;border:12px solid #1a1f27;border-radius:22px;overflow:hidden;box-shadow:0 14px 44px rgba(20,30,45,.2);background:#0e1319}
  .tablet iframe{display:block;width:100%;height:780px;border:0}

  .phone{width:340px;max-width:100%;border:11px solid #1a1f27;border-radius:34px;overflow:hidden;box-shadow:0 14px 44px rgba(20,30,45,.2);background:#0e1319}
  .phone .notch{height:20px;background:#1a1f27}
  .phone iframe{display:block;width:100%;height:680px;border:0}
</style>
</head>
<body>
  <h1>How the dashboard looks</h1>
  <div class="lead">Table with columns on desktop and tablet; folds into cards only on a phone. Light and dark.</div>

  <div class="sec">
    <h3>💻 Desktop — table with columns</h3>
    <div class="pair col">
      <div><div class="browser"><div class="bar"><span></span><span></span><span></span></div><iframe src="mockup.html" title="Desktop dark"></iframe></div><div class="cap">Dark</div></div>
      <div><div class="browser lite"><div class="bar"><span></span><span></span><span></span></div><iframe src="mockup.html?light" title="Desktop light"></iframe></div><div class="cap">Light</div></div>
    </div>
  </div>

  <div class="sec">
    <h3>📲 Tablet — table with columns</h3>
    <div class="pair">
      <div><div class="tablet"><iframe src="mockup.html" title="Tablet dark"></iframe></div><div class="cap">Dark</div></div>
    </div>
  </div>

  <div class="sec">
    <h3>📱 Mobile — folds into cards</h3>
    <div class="pair">
      <div><div class="phone"><div class="notch"></div><iframe src="mockup.html" title="Mobile dark"></iframe></div><div class="cap">Dark</div></div>
      <div><div class="phone"><div class="notch"></div><iframe src="mockup.html?light" title="Mobile light"></iframe></div><div class="cap">Light</div></div>
    </div>
  </div>
</body>
</html>
